name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # The SQL metadata backend, against the engine production actually runs.
  #
  # db_conformance_test.go has always had a postgres arm and it ran for
  # NOBODY: it turns on only when BDRIVE_TEST_POSTGRES is set, and no CI here
  # ever set it, so the one backend the managed hub uses was covered by
  # whoever happened to export a DSN by hand. A migration that is valid
  # SQLite and invalid Postgres — one wrong column type is enough, and there
  # is no type rewriting in the dialect shim — would have been caught by
  # nothing in this repo and by the hub failing to boot in that one.
  #
  # Only the webapp package, and only on Linux: this is about a database, not
  # a platform, and the suite it belongs to already runs in full above.
  meta-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bdrive
          POSTGRES_PASSWORD: bdrive
          POSTGRES_DB: bdrive
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U bdrive"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: metadata conformance on postgres
        run: go test ./internal/webapp -run 'Conformance|Pending|SQL' -count=1 -v
        env:
          BDRIVE_TEST_POSTGRES: postgres://bdrive:bdrive@localhost:5544/bdrive?sslmode=disable

  # The race detector, kept off the critical path by not running the whole
  # suite under it.
  #
  # `go test ./... -race` takes 44 minutes, almost all of it internal/webapp,
  # whose slowest tests drive real bdrive processes and real sync cycles and
  # have nothing concurrent to say. The split below is ~4 minutes and covers
  # what races actually live in: every other package whole, and the webapp's
  # concurrent paths by name (the relay and its rooms, presence, the event
  # stream, and the check-then-write on uploads).
  #
  # It exists because it was missing: a genuine data race in
  # TestCollabSevenEditorsOneFile — counters written atomically and read
  # plainly while the reader goroutines were still draining — sat undetected
  # from #228 until somebody ran -race by hand. Ubuntu alone; a race is not
  # platform-specific and the macOS runner is the slower of the two.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: race — every package but the webapp suite
        run: go test -race -timeout 20m $(go list ./... | grep -v '/internal/webapp$')
      - name: race — the webapp's concurrent paths
        run: |
          go test -race -timeout 20m ./internal/webapp \
            -run 'Collab|Concurrent|Stress|Events|Presence|Upload|Store'
